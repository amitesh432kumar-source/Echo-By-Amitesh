<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bf0">
<title>Echo by Amitesh</title>
<style>
:root{
  --bg:#f6f6fb; --panel:#ffffff; --text:#1b1b2a; --muted:#6b6b80;
  --accent:#5b5bf0; --accent-text:#ffffff; --user:#5b5bf0; --user-text:#ffffff;
  --bot:#ffffff; --border:#e4e4ee; --err:#b3261e; --code:#efeff8;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f0f17; --panel:#181824; --text:#ececf6; --muted:#9a9ab0;
    --accent:#7b7bff; --accent-text:#0f0f17; --user:#5b5bf0; --user-text:#ffffff;
    --bot:#1f1f2e; --border:#2b2b3d; --err:#ff8a80; --code:#14141f;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;
  font-size:16px; line-height:1.5;
  display:flex; flex-direction:column; height:100dvh;
}
header{
  display:flex; align-items:center; gap:10px; padding:10px 16px;
  padding-top:max(10px, env(safe-area-inset-top));
  background:var(--panel); border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.logo{
  width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-text);
  display:grid; place-items:center; font-weight:700; flex:none;
}
.brand b{display:block; line-height:1.1}
.brand small{color:var(--muted); font-size:12px}
.spacer{flex:1}
.switch{display:flex; background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:3px}
.switch button{
  border:0; background:transparent; color:var(--muted); padding:6px 12px; border-radius:999px;
  font:inherit; font-size:14px; cursor:pointer;
}
.switch button[aria-pressed="true"]{background:var(--accent); color:var(--accent-text); font-weight:600}
#newChat{
  border:1px solid var(--border); background:transparent; color:var(--text);
  border-radius:999px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer;
}
main{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth}
.row{display:flex; flex-direction:column; max-width:min(720px,100%); width:100%; margin:0 auto}
.row.user{align-items:flex-end}
.row.bot{align-items:flex-start}
.bubble{
  padding:10px 14px; border-radius:18px; max-width:88%; overflow-wrap:anywhere; word-break:break-word;
}
.user .bubble{background:var(--user); color:var(--user-text); border-bottom-right-radius:6px; white-space:pre-wrap}
.bot .bubble{background:var(--bot); border:1px solid var(--border); border-bottom-left-radius:6px}
.bot .bubble.error{color:var(--err); border-color:var(--err)}
.bubble img{display:block; max-width:100%; max-height:240px; border-radius:12px; margin-bottom:6px}
.bubble .tag{font-size:13px; opacity:.85; margin-bottom:4px}
.bubble pre{background:var(--code); border-radius:10px; padding:10px; overflow-x:auto; margin:8px 0; font-size:14px}
.bubble code{background:var(--code); border-radius:6px; padding:1px 5px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.92em}
.bubble pre code{background:none; padding:0}
.meta{font-size:12px; color:var(--muted); margin:3px 8px 0}
.typing span{display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:var(--muted); animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.welcome{margin:auto; text-align:center; max-width:460px; padding:24px 8px}
.welcome h1{font-size:26px; margin:0 0 6px}
.welcome p{color:var(--muted); margin:0 0 18px}
.chips{display:flex; flex-direction:column; gap:8px}
.chips button{
  border:1px solid var(--border); background:var(--panel); color:var(--text); padding:10px 14px;
  border-radius:14px; font:inherit; font-size:15px; text-align:left; cursor:pointer;
}
#preview{
  display:flex; align-items:center; gap:10px; padding:8px 16px; background:var(--panel);
  border-top:1px solid var(--border);
}
#preview[hidden]{display:none}
#preview img{height:56px; border-radius:10px}
#preview button{border:0; background:transparent; color:var(--muted); font-size:22px; cursor:pointer}
form{
  display:flex; align-items:flex-end; gap:8px; padding:10px 12px;
  padding-bottom:max(10px, env(safe-area-inset-bottom));
  background:var(--panel); border-top:1px solid var(--border);
}
textarea{
  flex:1; resize:none; border:1px solid var(--border); background:var(--bg); color:var(--text);
  border-radius:20px; padding:10px 14px; font:inherit; max-height:160px; outline:none;
}
textarea:focus{border-color:var(--accent)}
.icon, #send{
  border:0; border-radius:50%; width:42px; height:42px; flex:none; cursor:pointer; font-size:18px;
  display:grid; place-items:center;
}
.icon{background:var(--bg); color:var(--text); border:1px solid var(--border)}
#send{background:var(--accent); color:var(--accent-text); font-weight:700}
#send:disabled{opacity:.5; cursor:default}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">E</div>
    <div><b>Echo</b><small>by Amitesh</small></div>
  </div>
  <div class="spacer"></div>
  <div class="switch" role="group" aria-label="Choose AI model">
    <button type="button" data-model="claude">Claude</button>
    <button type="button" data-model="gemini">Gemini</button>
  </div>
  <button type="button" id="newChat">New</button>
</header>

<main id="chat" aria-live="polite"></main>

<div id="preview" hidden>
  <img id="previewImg" alt="Attached photo">
  <span class="spacer"></span>
  <button type="button" id="removeImg" aria-label="Remove photo">&times;</button>
</div>

<form id="composer">
  <button type="button" class="icon" id="attach" aria-label="Attach a photo" title="Attach a photo">&#128206;</button>
  <input type="file" id="file" accept="image/*" hidden>
  <textarea id="input" rows="1" placeholder="Echo से कुछ भी पूछिए / Ask Echo anything"></textarea>
  <button type="submit" id="send" aria-label="Send">&#10148;</button>
</form>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var chatEl = $('#chat'), input = $('#input'), form = $('#composer'), sendBtn = $('#send');
  var fileInput = $('#file'), previewEl = $('#preview'), previewImg = $('#previewImg');

  var STORE = 'echo_chat_v1', MODEL_KEY = 'echo_model', CODE_KEY = 'echo_code';
  var MODEL_NAMES = { claude: 'Claude', gemini: 'Gemini' };

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var messages = [];
  var model = safeGet(MODEL_KEY) === 'gemini' ? 'gemini' : 'claude';
  var pendingImage = null;
  var busy = false;

  try {
    var saved = JSON.parse(safeGet(STORE) || '[]');
    if (Array.isArray(saved)) messages = saved;
  } catch (e) { messages = []; }

  function save() {
    var slim = messages.slice(-60).map(function (m) {
      return { role: m.role, text: m.text, hadImage: !!(m.image || m.hadImage), error: !!m.error, model: m.model };
    });
    safeSet(STORE, JSON.stringify(slim));
  }

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMd(t) {
    return t.split('```').map(function (p, i) {
      if (i % 2 === 1) {
        var nl = p.indexOf('\n');
        var body = (nl > -1 && /^[\w+#-]*$/.test(p.slice(0, nl).trim())) ? p.slice(nl + 1) : p;
        return '<pre><code>' + esc(body.replace(/\n$/, '')) + '</code></pre>';
      }
      return esc(p)
        .replace(/`([^`\n]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }).join('');
  }

  function row(cls) {
    var r = document.createElement('div');
    r.className = 'row ' + cls;
    return r;
  }

  var SUGGESTIONS = [
    'मुझे आसान भाषा में बताओ कि AI कैसे काम करता है',
    'Write a short email asking my teacher for leave',
    'Give me 5 ideas for a school science project'
  ];

  function render() {
    chatEl.innerHTML = '';
    document.querySelectorAll('.switch button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.model === model));
    });

    if (!messages.length && !busy) {
      var w = document.createElement('div');
      w.className = 'welcome';
      w.innerHTML = '<h1>नमस्ते! मैं Echo हूँ</h1><p>Amitesh का बनाया AI असिस्टेंट. Hindi, English या Hinglish, जिसमें चाहें बात करें.</p>';
      var chips = document.createElement('div');
      chips.className = 'chips';
      SUGGESTIONS.forEach(function (s) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = s;
        b.addEventListener('click', function () { send(s); });
        chips.appendChild(b);
      });
      w.appendChild(chips);
      chatEl.appendChild(w);
      return;
    }

    messages.forEach(function (m) {
      var isUser = m.role === 'user';
      var r = row(isUser ? 'user' : 'bot');
      var b = document.createElement('div');
      b.className = 'bubble' + (m.error ? ' error' : '');
      if (m.image) {
        var img = document.createElement('img');
        img.alt = 'Your photo';
        img.src = 'data:' + m.image.mime + ';base64,' + m.image.data;
        b.appendChild(img);
      } else if (m.hadImage) {
        var tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = '📷 photo';
        b.appendChild(tag);
      }
      if (isUser) {
        if (m.text) b.appendChild(document.createTextNode(m.text));
      } else {
        var d = document.createElement('div');
        d.innerHTML = renderMd(m.text || '');
        b.appendChild(d);
      }
      r.appendChild(b);
      if (!isUser && m.model && !m.error) {
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = MODEL_NAMES[m.model] || '';
        r.appendChild(meta);
      }
      chatEl.appendChild(r);
    });

    if (busy) {
      var tr = row('bot');
      var tb = document.createElement('div');
      tb.className = 'bubble typing';
      tb.innerHTML = '<span></span><span></span><span></span>';
      tr.appendChild(tb);
      chatEl.appendChild(tr);
    }
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  function updatePreview() {
    if (pendingImage) {
      previewImg.src = 'data:' + pendingImage.mime + ';base64,' + pendingImage.data;
      previewEl.hidden = false;
    } else {
      previewEl.hidden = true;
      previewImg.removeAttribute('src');
    }
  }

  function fileToImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 1280, w = img.width, h = img.height;
        var s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = c.toDataURL('image/jpeg', 0.8);
        URL.revokeObjectURL(url);
        resolve({ mime: 'image/jpeg', data: dataUrl.split(',')[1] });
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Could not read that image'));
      };
      img.src = url;
    });
  }

  function buildPayload() {
    var list = messages.filter(function (m) { return !m.error; }).map(function (m) {
      return { role: m.role, text: m.text || '', image: m.image || null };
    }).slice(-20);
    var body = JSON.stringify({ model: model, messages: list });
    if (body.length > 3800000) {
      var last = -1;
      list.forEach(function (m, i) { if (m.image) last = i; });
      list = list.map(function (m, i) { return i === last ? m : { role: m.role, text: m.text, image: null }; });
      body = JSON.stringify({ model: model, messages: list });
    }
    return body;
  }

  function callApi(retry) {
    var headers = { 'Content-Type': 'application/json' };
    var code = safeGet(CODE_KEY);
    if (code) headers['x-access-code'] = code;
    return fetch('/api/chat', { method: 'POST', headers: headers, body: buildPayload() })
      .catch(function () { throw new Error('Network problem. Check your internet and try again.'); })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (data) {
          if (r.status === 401 && retry) {
            var c = window.prompt('Enter the access code for Echo:');
            if (c) { safeSet(CODE_KEY, c.trim()); return callApi(false); }
            throw new Error('Access code needed.');
          }
          if (!r.ok) throw new Error(data.error || ('Something went wrong (' + r.status + ')'));
          return data.reply;
        });
      });
  }

  function send(text) {
    if (busy) return;
    text = (text || '').trim();
    if (!text && !pendingImage) return;
    messages.push({ role: 'user', text: text, image: pendingImage });
    pendingImage = null;
    updatePreview();
    input.value = '';
    autosize();
    busy = true;
    sendBtn.disabled = true;
    render();
    var usedModel = model;
    callApi(true).then(function (reply) {
      messages.push({ role: 'assistant', text: reply, model: usedModel });
    }).catch(function (e) {
      messages.push({ role: 'assistant', text: e.message, error: true });
    }).then(function () {
      busy = false;
      sendBtn.disabled = false;
      save();
      render();
    });
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); send(input.value); });
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', function (e) {
    var touch = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
    if (e.key === 'Enter' && !e.shiftKey && !touch) { e.preventDefault(); send(input.value); }
  });

  document.querySelectorAll('.switch button').forEach(function (b) {
    b.addEventListener('click', function () {
      model = b.dataset.model;
      safeSet(MODEL_KEY, model);
      render();
    });
  });

  $('#newChat').addEventListener('click', function () {
    if (busy) return;
    messages = [];
    pendingImage = null;
    updatePreview();
    save();
    render();
  });

  $('#attach').addEventListener('click', function () { fileInput.click(); });
  $('#removeImg').addEventListener('click', function () { pendingImage = null; updatePreview(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    fileToImage(f).then(function (img) { pendingImage = img; updatePreview(); })
      .catch(function (e) { alert(e.message); });
  });

  render();
  autosize();
})();
</script>
</body>
</html>
